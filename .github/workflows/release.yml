name: Release Windows

# Al subir un tag vX.Y.Z se arma el programa de Windows y se publica como Release.
# El programa instalado lo detecta y ofrece actualizarse.
on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Instalar dependencias
        run: pip install -r requirements.txt pyinstaller

      - name: Version desde el tag
        shell: pwsh
        run: |
          $v = "${{ github.ref_name }}".TrimStart("v")
          Set-Content -NoNewline -Encoding ascii VERSION $v

      - name: Armar ejecutable
        run: >
          pyinstaller --noconfirm --windowed --onedir --name AnalisisKarting
          --paths app --add-data "web;web" --add-data "VERSION;."
          --collect-all libxrk --collect-all webview --collect-submodules pyarrow
          --exclude-module matplotlib --exclude-module IPython --exclude-module tkinter
          app/desktop.py

      - name: Comprimir
        shell: pwsh
        run: Compress-Archive -Path dist/AnalisisKarting -DestinationPath AnalisisKarting-windows.zip

      - name: Publicar release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git fetch --force --tags   # checkout deja el tag liviano; trae el anotado con sus notas
          $notes = git tag -l --format='%(contents)' "${{ github.ref_name }}"
          if (-not $notes) { $notes = "Versión ${{ github.ref_name }}" }
          Set-Content -Encoding utf8 notas.txt $notes
          gh release create "${{ github.ref_name }}" AnalisisKarting-windows.zip --title "Análisis Karting ${{ github.ref_name }}" --notes-file notas.txt
